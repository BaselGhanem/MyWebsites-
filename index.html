<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080a0c">
  <title>مشاريع GitHub | Basel Ghanem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#080a0c; --surface:rgba(18,22,26,.72); --surface-hover:rgba(28,34,39,.92); --line:rgba(255,255,255,.09); --line-hover:rgba(255,255,255,.2); --text:#f8fafc; --muted:#9aa6b2; --teal:#099999; --teal-soft:rgba(9,153,153,.14); --purple:#8b5cf6; --shadow:0 20px 55px rgba(0,0,0,.28); }
    [data-theme="light"] { --bg:#f5f7f8; --surface:rgba(255,255,255,.78); --surface-hover:#fff; --line:rgba(12,24,28,.1); --line-hover:rgba(9,153,153,.55); --text:#102022; --muted:#627276; --teal-soft:rgba(9,153,153,.1); --shadow:0 20px 55px rgba(12,42,45,.1); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:Almarai,Arial,sans-serif; transition:background .35s,color .35s; overflow-x:hidden; }
    .ambient { position:fixed; inset:0; z-index:-1; pointer-events:none; background:radial-gradient(circle at 12% 0%,rgba(9,153,153,.27),transparent 29rem),radial-gradient(circle at 88% 95%,rgba(139,92,246,.15),transparent 30rem); filter:blur(18px); }
    .shell { width:min(1240px,calc(100% - 38px)); margin:auto; padding:24px 0 70px; }
    .nav { display:flex; justify-content:space-between; align-items:center; width:100%; gap:16px; padding:9px 10px 9px 18px; border:1px solid var(--line); border-radius:18px; background:var(--surface); backdrop-filter:blur(20px); box-shadow:0 8px 32px rgba(0,0,0,.17); animation:reveal .65s .05s both; }
    .brand { display:flex; align-items:center; gap:9px; font-family:Inter,sans-serif; font-weight:700; font-size:.88rem; }
    .brand-dot { width:10px; height:10px; border-radius:50%; background:var(--teal); box-shadow:0 0 16px var(--teal); }
    .nav-actions { display:flex; align-items:center; gap:7px; }
    .account-button { display:flex; align-items:center; gap:8px; height:36px; padding:0 13px; border:1px solid var(--line); border-radius:11px; background:transparent; color:var(--muted); font:700 .72rem Almarai,sans-serif; cursor:pointer; transition:.25s; }
    .account-button svg { width:15px; height:15px; }.account-button:hover { color:var(--teal); border-color:rgba(9,153,153,.5); background:var(--teal-soft); }
    .icon-button { width:36px; height:36px; display:grid; place-items:center; border:0; border-radius:50%; background:transparent; color:var(--muted); cursor:pointer; transition:.25s; }
    .icon-button:hover { background:var(--teal-soft); color:var(--teal); transform:rotate(14deg); }
    svg { width:20px; height:20px; fill:currentColor; }
    .hero { text-align:center; padding:78px 0 42px; animation:reveal .8s .12s both; }
    .eyebrow { display:inline-flex; align-items:center; gap:8px; margin-bottom:21px; padding:8px 12px; border:1px solid rgba(9,153,153,.25); border-radius:999px; background:var(--teal-soft); color:var(--teal); font:700 .7rem Inter,sans-serif; letter-spacing:.08em; }
    h1 { margin:0; font-size:clamp(2.3rem,6vw,5.1rem); letter-spacing:-.055em; line-height:1.08; font-weight:800; background:linear-gradient(135deg,var(--text) 38%,var(--muted)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .hero p { max-width:650px; margin:22px auto 0; color:var(--muted); font-size:clamp(.92rem,1.8vw,1.1rem); line-height:1.9; }
    .stats { display:inline-flex; justify-content:center; gap:0; margin-top:34px; padding:14px 8px; border:1px solid var(--line); border-radius:17px; background:rgba(255,255,255,.015); }
    .stat { min-width:80px; display:grid; gap:6px; }
    .stat + .stat { border-right:1px solid var(--line); }
    .stat strong { font-family:Inter,sans-serif; font-size:1.45rem; color:var(--text); }
    .stat span { color:var(--muted); font-size:.72rem; }
    .stat:first-child strong { color:var(--teal); }
    .command { position:sticky; top:18px; z-index:5; display:flex; align-items:center; gap:10px; width:min(760px,100%); margin:0 auto 44px; padding:8px; border:1px solid var(--line); border-radius:999px; background:var(--surface); backdrop-filter:blur(25px); box-shadow:var(--shadow); transition:.25s; animation:reveal .85s .25s both; }
    .command:focus-within { border-color:var(--teal); box-shadow:0 0 0 1px var(--teal),var(--shadow); transform:translateY(-2px); }
    .input-wrap { flex:1; display:flex; align-items:center; gap:11px; padding:0 15px; color:var(--muted); }
    input { width:100%; min-width:0; border:0; outline:0; background:transparent; color:var(--text); font:500 .93rem Inter,Almarai,sans-serif; padding:13px 0; direction:ltr; text-align:left; }
    input::placeholder { color:var(--muted); }
    .kbd { direction:ltr; padding:4px 7px; border:1px solid var(--line); border-radius:6px; color:var(--muted); font:500 .7rem Inter,sans-serif; }
    .load-button { border:0; padding:12px 18px; border-radius:999px; background:var(--teal); color:#fff; font:700 .82rem Almarai,sans-serif; cursor:pointer; white-space:nowrap; transition:.25s; }
    .load-button:hover { background:#078080; transform:translateY(-1px); }
    .load-button:disabled { opacity:.65; cursor:wait; transform:none; }
    .search-meta { min-width:72px; padding-inline:10px; color:var(--muted); direction:rtl; font-size:.72rem; white-space:nowrap; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:20px; color:var(--muted); font-size:.82rem; }
    .toolbar strong { color:var(--text); font-family:Inter,sans-serif; }
    .copy { display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:999px; padding:9px 13px; background:var(--surface); color:var(--muted); font:700 .76rem Almarai,sans-serif; cursor:pointer; transition:.25s; }
    .copy svg { width:15px; height:15px; }.copy:hover { border-color:var(--teal); color:var(--teal); }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(285px,1fr)); gap:18px; }
    .card { position:relative; display:flex; flex-direction:column; min-height:218px; padding:22px; overflow:hidden; border:1px solid var(--line); border-radius:21px; background:var(--surface); backdrop-filter:blur(14px); box-shadow:0 7px 25px rgba(0,0,0,.08); transition:.35s cubic-bezier(.2,.8,.2,1); animation:reveal .6s both; }
    .card::before { content:""; position:absolute; inset:0; pointer-events:none; opacity:0; transition:.35s; background:radial-gradient(420px circle at var(--x,50%) var(--y,50%),rgba(255,255,255,.08),transparent 42%); }
    .card:hover { transform:translateY(-5px) scale(1.008); background:var(--surface-hover); border-color:var(--line-hover); box-shadow:var(--shadow); }.card:hover::before{opacity:1;}
    .card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; }
    .repo-icon { width:47px; height:47px; display:grid; place-items:center; flex:none; border:1px solid var(--line); border-radius:14px; color:var(--teal); background:var(--teal-soft); }.repo-icon svg{width:23px;height:23px;}
    .badge { display:flex; align-items:center; gap:6px; color:var(--muted); font:500 .7rem Inter,sans-serif; }.dot{width:7px;height:7px;border-radius:50%;background:#10b981;box-shadow:0 0 12px #10b981;}
    .name { margin:19px 0 8px; color:var(--text); direction:ltr; text-align:right; overflow-wrap:anywhere; font:700 1.1rem Inter,Almarai,sans-serif; }
    .url { margin:0; color:var(--muted); direction:ltr; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:400 .74rem Inter,sans-serif; }
    .actions { display:flex; gap:9px; margin-top:auto; padding-top:24px; }
    .action { flex:1; display:flex; align-items:center; justify-content:center; gap:8px; min-height:39px; border:1px solid var(--line); border-radius:10px; color:var(--text); background:transparent; text-decoration:none; font:700 .73rem Almarai,sans-serif; transition:.25s; }.action svg{width:16px;height:16px;}.action:hover{border-color:var(--line-hover);background:rgba(255,255,255,.06);}.action.live{background:var(--teal);border-color:var(--teal);color:#fff;}.action.live:hover{background:#078080;}
    .message { grid-column:1/-1; padding:55px 20px; text-align:center; border:1px dashed var(--line-hover); border-radius:21px; color:var(--muted); background:var(--surface); line-height:1.8; }
    .message.error { color:#fca5a5; border-color:rgba(239,68,68,.5); }
    .modal { position:fixed; inset:0; z-index:30; display:grid; place-items:center; padding:20px; background:rgba(0,0,0,.67); backdrop-filter:blur(16px); opacity:0; visibility:hidden; transition:.25s; }
    .modal.open { opacity:1; visibility:visible; }.modal-card { width:min(500px,100%); padding:25px; border:1px solid var(--line-hover); border-radius:22px; background:var(--bg); box-shadow:0 30px 90px rgba(0,0,0,.45); transform:translateY(15px) scale(.98); transition:.3s; }.modal.open .modal-card{transform:none;}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:22px}.modal-head h2{margin:0 0 7px;font-size:1.15rem}.modal-head p{margin:0;color:var(--muted);font-size:.76rem;line-height:1.7}.close-button{width:35px;height:35px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--muted);cursor:pointer}.account-form{display:grid;gap:12px}.account-input{padding:14px 15px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font:500 .88rem Inter,sans-serif;outline:0;direction:ltr}.account-input:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
    @keyframes reveal { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    @media(max-width:620px){.shell{width:min(100% - 24px,1240px);padding-top:12px}.nav{border-radius:15px}.brand{font-size:.75rem}.account-button span{display:none}.account-button{width:36px;padding:0;justify-content:center}.hero{padding:55px 7px 35px}.eyebrow{margin-bottom:17px}.stats{width:100%;}.stat{flex:1}.command{position:relative;top:auto;margin-bottom:28px;border-radius:16px;padding:7px}.kbd{display:none}.search-meta{display:none}.toolbar{align-items:flex-start;flex-direction:column}.copy{width:100%;justify-content:center}.grid{grid-template-columns:1fr}.card{min-height:205px}.actions{opacity:1}.action{font-size:.72rem}}
  </style>
</head>
<body>
  <div class="ambient"></div>
  <main class="shell">
    <nav class="nav"><div class="brand"><span class="brand-dot"></span>BASEL PROJECT HUB</div><div class="nav-actions"><button class="account-button" id="accountButton" type="button"><svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6ZM4 21v-2a7 7 0 0 1 14 0v2h-2v-2a5 5 0 0 0-10 0v2H4Z"/></svg><span>تغيير الحساب</span></button><button class="icon-button" id="themeToggle" title="تبديل المظهر" aria-label="تبديل المظهر"><svg viewBox="0 0 24 24"><path d="M12 4.5a7.5 7.5 0 1 0 7.5 7.5A6 6 0 0 1 12 4.5Z"/></svg></button></div></nav>
    <section class="hero"><div class="eyebrow">CURATED GITHUB PORTFOLIO</div><h1>مشاريعي الرقمية</h1><p>مكتبة موحدة لجميع المشاريع، تتيح الوصول السريع إلى النسخة المنشورة والكود المصدري بتجربة مرتبة وسلسة.</p><div class="stats"><div class="stat"><strong id="repoCount">—</strong><span>مشروع</span></div><div class="stat"><strong id="siteCount">—</strong><span>رابط مباشر</span></div><div class="stat"><strong id="starCount">—</strong><span>نجمة</span></div></div></section>
    <div class="command"><div class="input-wrap"><svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 1 1-5.3 12.8L2 19l3 3.2 3.2-3.2A7.5 7.5 0 0 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg><input id="projectSearch" placeholder="ابحث باسم المشروع..." autocomplete="off"><span class="kbd">/</span></div><span class="search-meta" id="searchMeta"></span></div>
    <section id="result" aria-live="polite"><div class="message">جارٍ تحميل المشاريع...</div></section>
  </main>
  <div class="modal" id="accountModal" role="dialog" aria-modal="true" aria-labelledby="accountTitle"><div class="modal-card"><div class="modal-head"><div><h2 id="accountTitle">تغيير حساب GitHub</h2><p>أدخل رابط الحساب أو اسم المستخدم، وسيتم تحميل مستودعاته العامة.</p></div><button class="close-button" id="closeModal" type="button" aria-label="إغلاق">×</button></div><form class="account-form" id="form"><input class="account-input" id="profileUrl" value="https://github.com/BaselGhanem" placeholder="https://github.com/username" autocomplete="url" required><button class="load-button" id="loadButton" type="submit">تحميل الحساب</button></form></div></div>
  <script>
    const form = document.querySelector(`#form`);
    const input = document.querySelector(`#profileUrl`);
    const result = document.querySelector(`#result`);
    const loadButton = document.querySelector(`#loadButton`);
    const repoCount = document.querySelector(`#repoCount`);
    const siteCount = document.querySelector(`#siteCount`);
    const starCount = document.querySelector(`#starCount`);
    const projectSearch = document.querySelector(`#projectSearch`);
    const searchMeta = document.querySelector(`#searchMeta`);
    const accountModal = document.querySelector(`#accountModal`);
    let allRepositories = [];
    let activeUsername = `BaselGhanem`;
    const icon = { external: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42L17.59 5H14V3ZM5 5h6V3H3v8h2V5Zm0 14v-6H3v8h8v-2H5Zm14-6v6h-6v2h8v-8h-2Z"/></svg>`, github: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5A11.5 11.5 0 0 0 8.36 22.91c.58.11.79-.25.79-.56v-2.2c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.03 1.77 2.71 1.26 3.37.97.1-.75.4-1.26.73-1.55-2.57-.29-5.27-1.29-5.27-5.72 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.47.11-3.06 0 0 .97-.31 3.17 1.18A11 11 0 0 1 12 4.8c.98 0 1.96.13 2.88.39 2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.77.11 3.06.74.81 1.19 1.84 1.19 3.1 0 4.44-2.7 5.43-5.28 5.71.41.36.78 1.08.78 2.18v3.23c0 .31.21.68.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg>` };
    const escapeHtml = value => String(value).replace(/[&<>"']/g, character => ({"&":`&amp;`,"<":`&lt;`,">":`&gt;`,"\"":`&quot;`,"'":`&#039;`}[character]));
    function usernameFrom(value) { const clean = value.trim().replace(/^@/, ``); if (!clean.includes(`/`) && /^[A-Za-z0-9-]+$/.test(clean)) return clean; try { const url = new URL(clean.includes(`://`) ? clean : `https://${clean}`); return /^(www\.)?github\.com$/i.test(url.hostname) ? url.pathname.split(`/`).filter(Boolean)[0] || null : null; } catch { return null; } }
    async function fetchRepositories(username) { const repositories = []; for (let page = 1; ; page += 1) { const response = await fetch(`https://api.github.com/users/${encodeURIComponent(username)}/repos?per_page=100&page=${page}&sort=updated`, {headers:{Accept:`application/vnd.github+json`}}); if (response.status === 404) throw new Error(`لم يتم العثور على هذا الحساب.`); if (!response.ok) throw new Error(`تعذر الاتصال بـ GitHub. حاول لاحقاً.`); const batch = await response.json(); repositories.push(...batch); if (batch.length < 100) return repositories; } }
    function pageUrl(repository) { return `https://${repository.owner.login}.github.io/${repository.name}/`; }
    function renderCards(repositories) {
      const grid = document.querySelector(`#grid`);
      grid.innerHTML = ``;
      searchMeta.textContent = `${repositories.length} نتيجة`;
      if (!repositories.length) {
        grid.innerHTML = `<div class="message">لا توجد مشاريع مطابقة للبحث.</div>`;
        return;
      }
      repositories.forEach((repository, index) => {
        const page = pageUrl(repository);
        const card = document.createElement(`article`);
        card.className = `card`;
        card.style.animationDelay = `${Math.min(index * .025, .45)}s`;
        card.innerHTML = `<div class="card-top"><div class="repo-icon">${icon.github}</div><span class="badge"><i class="dot"></i>متاح</span></div><h2 class="name">${escapeHtml(repository.name)}</h2><p class="url">${escapeHtml(page)}</p><div class="actions"><a class="action" href="${repository.html_url}" target="_blank" rel="noopener noreferrer">${icon.github}<span>GitHub</span></a><a class="action live" href="${page}" target="_blank" rel="noopener noreferrer">${icon.external}<span>عرض الموقع</span></a></div>`;
        card.addEventListener(`mousemove`, event => {
          const rect = card.getBoundingClientRect();
          card.style.setProperty(`--x`, `${event.clientX - rect.left}px`);
          card.style.setProperty(`--y`, `${event.clientY - rect.top}px`);
        });
        grid.append(card);
      });
    }
    function render(repositories, username) {
      allRepositories = repositories;
      activeUsername = username;
      const links = repositories.flatMap(repository => [pageUrl(repository), repository.html_url]).join(`\n`);
      repoCount.textContent = repositories.length;
      siteCount.textContent = repositories.length;
      starCount.textContent = repositories.reduce((sum, repository) => sum + (repository.stargazers_count || 0), 0);
      result.innerHTML = `<div class="toolbar"><span>مشاريع <strong dir="ltr">${escapeHtml(username)}</strong> مرتبة حسب آخر تحديث</span><button class="copy" id="copyAll">${icon.external} نسخ كل الروابط</button></div><div class="grid" id="grid"></div>`;
      renderCards(repositories);
      document.querySelector(`#copyAll`).addEventListener(`click`, async () => {
        await navigator.clipboard.writeText(links);
        const button = document.querySelector(`#copyAll`);
        button.innerHTML = `${icon.external} تم النسخ ✓`;
        setTimeout(() => { button.innerHTML = `${icon.external} نسخ كل الروابط`; }, 1800);
      });
    }
    async function load() {
      const username = usernameFrom(input.value);
      if (!username) {
        result.innerHTML = `<div class="message error">أدخل رابط GitHub صحيحاً أو اسم المستخدم فقط.</div>`;
        return;
      }
      loadButton.disabled = true;
      loadButton.textContent = `جارٍ التحميل...`;
      result.innerHTML = `<div class="message">جارٍ جلب المستودعات العامة...</div>`;
      try {
        render(await fetchRepositories(username), username);
        projectSearch.value = ``;
        accountModal.classList.remove(`open`);
        localStorage.setItem(`githubProjectHubAccount`, username);
      } catch (error) {
        repoCount.textContent = `—`;
        siteCount.textContent = `—`;
        starCount.textContent = `—`;
        result.innerHTML = `<div class="message error">${escapeHtml(error.message)}</div>`;
      } finally {
        loadButton.disabled = false;
        loadButton.textContent = `تحميل الحساب`;
      }
    }
    form.addEventListener(`submit`, event => { event.preventDefault(); load(); });
    projectSearch.addEventListener(`input`, () => {
      const term = projectSearch.value.trim().toLowerCase();
      renderCards(allRepositories.filter(repository => repository.name.toLowerCase().includes(term) || (repository.description || ``).toLowerCase().includes(term)));
    });
    document.addEventListener(`keydown`, event => {
      if (event.key === `/` && document.activeElement !== projectSearch && !accountModal.classList.contains(`open`)) {
        event.preventDefault();
        projectSearch.focus();
      }
      if (event.key === `Escape`) accountModal.classList.remove(`open`);
    });
    document.querySelector(`#accountButton`).addEventListener(`click`, () => { accountModal.classList.add(`open`); input.focus(); });
    document.querySelector(`#closeModal`).addEventListener(`click`, () => accountModal.classList.remove(`open`));
    accountModal.addEventListener(`click`, event => { if (event.target === accountModal) accountModal.classList.remove(`open`); });
    document.querySelector(`#themeToggle`).addEventListener(`click`, () => { const next = document.documentElement.dataset.theme === `dark` ? `light` : `dark`; document.documentElement.dataset.theme = next; localStorage.setItem(`githubProjectHubTheme`, next); });
    document.documentElement.dataset.theme = localStorage.getItem(`githubProjectHubTheme`) || `dark`;
    activeUsername = localStorage.getItem(`githubProjectHubAccount`) || `BaselGhanem`;
    input.value = `https://github.com/${activeUsername}`;
    load();
  </script>
</body>
</html>
